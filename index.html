<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darktech X - Miguel Davi Analytics</title>
    <style>
        :root {
            --bg-color: #050508;
            --card-bg: rgba(18, 18, 26, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-purple: #a855f7;
            --accent-cyan: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Mesh Gradient Roxo Estilo Tech de Fundo */
        .mesh-gradient {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.15), transparent 40%),
                        radial-gradient(circle at 85% 80%, rgba(79, 70, 229, 0.15), transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.08), transparent 50%);
        }

        .mesh-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(126, 34, 206, 0.1));
            filter: blur(80px);
            border-radius: 50%;
            top: 20%;
            left: 30%;
            animation: float 10s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(-30px, -30px) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        /* Container Centralizado */
        .container {
            width: 100%;
            max-width: 900px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 1;
        }

        /* Navbar Simples */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 6px;
        }

        .nav-badge {
            background: rgba(168, 85, 247, 0.1);
            color: var(--accent-purple);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        /* Card Principal do Gráfico */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .card-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .card-title p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stat-value {
            text-align: right;
        }

        .stat-value h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-purple);
        }

        .stat-value span {
            font-size: 0.75rem;
            color: #10b981;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Simulação de Gráfico Tech em CSS Puro */
        .chart-container {
            position: relative;
            height: 220px;
            width: 100%;
            margin-top: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .chart-grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 24px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .grid-line {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.03);
        }

        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            height: 100%;
            justify-content: flex-end;
            z-index: 2;
        }

        .bar {
            width: 100%;
            max-width: 36px;
            background: linear-gradient(to top, rgba(168, 85, 247, 0.2), var(--accent-purple));
            border-radius: 6px 6px 0 0;
            transition: all 0.3s ease;
            position: relative;
        }

        .bar:hover {
            background: linear-gradient(to top, var(--accent-purple), var(--accent-cyan));
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5));
        }

        .bar-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Informações Rodapé do Card */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #10b981;
        }
    </style>
</head>
<body>

    <div class="mesh-gradient">
        <div class="mesh-blob"></div>
    </div>

    <div class="container">
        <!-- Navegação -->
        <nav>
            <div class="logo">
                <div class="logo-icon"></div>
                Darktech X
            </div>
            <div class="nav-badge">Live Metrics</div>
        </nav>

        <!-- Card do Gráfico de Loucura -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <h1>Índice de Loucura</h1>
                    <p>Monitoramento em tempo real do sistema cerebral</p>
                </div>
                <div class="stat-value">
                    <h2>99.9%</h2>
                    <span>+14.2% hoje</span>
                </div>
            </div>

            <!-- Gráfico Estilizado -->
            <div class="chart-container">
                <div class="chart-grid-lines">
                    <div class="grid-line"></div>
                    <div class="grid-line"></div>
                    <div class="grid-line"></div>
                </div>
                
                <div class="bar-group">
                    <div class="bar" style="height: 45%;"></div>
                    <span class="bar-label">Seg</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 60%;"></div>
                    <span class="bar-label">Ter</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 35%;"></div>
                    <span class="bar-label">Qua</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 80%;"></div>
                    <span class="bar-label">Qui</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 95%;"></div>
                    <span class="bar-label">Sex</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 100%;"></div>
                    <span class="bar-label">Sáb</span>
                </div>
                <div class="bar-group">
                    <div class="bar" style="height: 85%;"></div>
                    <span class="bar-label">Dom</span>
                </div>
            </div>

            <div class="card-footer">
                <div><span class="status-dot"></span>Alvo: Miguel Davi Analytics</div>
                <div>Status: Operando no talo</div>
            </div>
        </div>
    </div>

</body>
</html>
